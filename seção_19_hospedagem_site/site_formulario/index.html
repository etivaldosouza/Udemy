<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter</title>
   
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/9e018b46c9.js" crossorigin="anonymous"></script>
    <script src="app.js" defer></script> <!--espera o html carregar para ser executado-->
</head>
<body>
    <header class="topo">
      <div class="container">
        <strong>Newsletter</strong>
        <button id="btnTema" class="btn">Alternar tema</button>
        <i class="fa-solid fa-circle-half-stroke"></i>
      </div>
    </header>
    <main class="container">
      <secion class="caixa">
        <h1>Inscreva-se</h1>
        <p>receba novidade do seu e-mail.sem Spam.</p>
        
        <form>
          <label for="Nome">Nome</label>
          <input type="text" name="nome" id="nome" placeholder="Seu nome">

          <label for="email">e-mail</label>
          <input type="email" name="email" id="email"  placeholder="nome@email.com">

          <button type="submit" class="btn primario">Quero receber</button>
        </form>
      </secion>
    </main>

    <footer class="rodape">
      <div class="container">
        <small>Newsletter <span id="ano"></span></small> <!--o span é para alterar o ano em js-->
      </div>
    </footer>
</body>
</html>
